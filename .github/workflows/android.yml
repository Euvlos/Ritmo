name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in Docker
        run: docker build --progress=plain --output type=local,dest=dist .
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ritmo-debug
          path: dist/ritmo-debug.apk
          if-no-files-found: error
