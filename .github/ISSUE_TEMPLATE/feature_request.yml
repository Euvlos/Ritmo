name: Feature request
description: Предложить улучшение
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Проблема, description: Какую проблему пользователя решает предложение? }
    validations: { required: true }
  - type: textarea
    id: solution
    attributes: { label: Предлагаемое решение }
    validations: { required: true }
